[project]
name = "bazaar-contrib-sidecar-windows"
version = "0.3.0rc11"
description = "Native Windows transport for Bazaar sidecar"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.15"
dependencies = ["bazaar-contrib-timer~=0.3.0rc7", "bazaar-core~=0.3.0rc1", "bazaar-contrib-sidecar~=0.3.0rc14"]

[project.entry-points."bazaar_compute_node.contribs"]
sidecar-windows = "bazaar_contrib_sidecar_windows:sidecar"

[project.urls]
Repository = "https://github.com/open-bazaar/contrib-sidecar-windows"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.bcn.ci]
platforms = ["windows"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:anyio"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.15"
pythonPlatform = "All"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
reportMatchNotExhaustive = "error"
reportUnreachable = "warning"
reportUnusedFunction = "warning"
reportUnusedVariable = "warning"

[tool.ruff.lint]
extend-select = ["ASYNC"]

[dependency-groups]
dev = [
    "aiofiles>=25.1.0",
    "types-aiofiles>=25.1.0",
    "blockbuster>=1.5.29,<1.6",
    "pyright==1.1.414",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
    "bazaar-compute-node~=0.3.0rc9",
    "bazaar-contrib-timer-wheel~=0.3.0rc9",
    "bazaar-contrib-sidecar-unix~=0.3.0rc9",
    "tomli-w>=1.2.0",
]
